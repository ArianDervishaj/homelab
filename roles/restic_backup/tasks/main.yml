---
- name: Install restic and cron
  ansible.builtin.apt:
    name: 
    - restic
    - cron
    state: present
    update_cache: true

- name: Create restic repo base directory per host
  ansible.builtin.file:
    path: "{{ restic_backup_base }}/{{ inventory_hostname }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Create restic repo directory per service
  ansible.builtin.file:
    path: "{{ restic_backup_base }}/{{ inventory_hostname }}/{{ item.name }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  loop: "{{ restic_backup_jobs }}"

- name: Deploy backup script
  ansible.builtin.template:
    src: restic-backup.sh.j2
    dest: /usr/local/bin/restic-backup.sh
    owner: root
    group: root
    mode: "0750"

- name: Schedule restic backup cron job
  ansible.builtin.cron:
    name: "restic backup"
    minute: "{{ restic_cron_minute }}"
    hour: "{{ restic_cron_hour }}"
    day: "{{ restic_cron_day }}"
    job: "/usr/local/bin/restic-backup.sh >> /var/log/restic-backup.log 2>&1"
    user: root
    state: present