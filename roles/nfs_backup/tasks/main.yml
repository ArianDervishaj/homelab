---
- name: Install NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true

- name: Create backup mount point
  ansible.builtin.file:
    path: "{{ nfs_backup_mount_point }}"
    state: directory
    mode: "0755"

- name: Mount NFS backup share
  ansible.posix.mount:
    src: "{{ nfs_backup_server }}:{{ nfs_backup_share_path }}"
    path: "{{ nfs_backup_mount_point }}"
    fstype: nfs
    opts: defaults,_netdev,x-systemd.after=network-online.target
    state: mounted