---
- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Install full kernel (cloud kernel lacks the i915 driver)
  ansible.builtin.apt:
    name: "{{ gpu_passthrough_kernel_package }}"
    state: present
    update_cache: true

- name: Find kernel images present in /boot
  ansible.builtin.find:
    paths: /boot
    patterns: vmlinuz-*
    file_type: file
  register: gpu_passthrough_boot_kernels

- name: Refuse to continue without a non-cloud kernel image on disk
  ansible.builtin.assert:
    that:
      - gpu_passthrough_boot_kernels.files | map(attribute='path')
        | reject('search', 'cloud') | list | length > 0
    fail_msg: >-
      No non-cloud kernel image in /boot. Purging the cloud kernels now would
      leave this host unbootable.
    success_msg: Non-cloud kernel image present, safe to remove cloud kernels.

- name: Collect installed cloud kernel packages
  ansible.builtin.set_fact:
    gpu_passthrough_cloud_packages: >-
      {{ ansible_facts.packages.keys()
         | select('match', gpu_passthrough_cloud_package_regex) | list }}

- name: Allow dpkg to remove the currently running kernel
  ansible.builtin.debconf:
    name: linux-base
    question: linux-base/removing-running-kernel
    vtype: boolean
    value: "false"
  when: gpu_passthrough_cloud_packages | length > 0

- name: Purge cloud kernel packages
  ansible.builtin.apt:
    name: "{{ gpu_passthrough_cloud_packages }}"
    state: absent
    purge: true
  when: gpu_passthrough_cloud_packages | length > 0

- name: Update GRUB before rebooting
  ansible.builtin.command: update-grub
  changed_when: false
  when: "'cloud' in ansible_kernel"

- name: Reboot into the full kernel
  ansible.builtin.reboot:
    msg: Rebooting out of the cloud kernel for iGPU passthrough
    reboot_timeout: "{{ gpu_passthrough_reboot_timeout }}"
  when: "'cloud' in ansible_kernel"

- name: Re-read kernel fact after reboot
  ansible.builtin.setup:
    gather_subset: min

- name: Assert the running kernel is not a cloud kernel
  ansible.builtin.assert:
    that:
      - "'cloud' not in ansible_kernel"
    fail_msg: "Still on {{ ansible_kernel }} after reboot, check the GRUB default."
    success_msg: "Running {{ ansible_kernel }}."

- name: Look for DRM render nodes
  ansible.builtin.find:
    paths: /dev/dri
    patterns: renderD*
    file_type: any
  register: gpu_passthrough_render_nodes

- name: Assert the iGPU is visible to the guest
  ansible.builtin.assert:
    that:
      - gpu_passthrough_render_nodes.matched > 0
    fail_msg: >-
      No render node under /dev/dri. Jellyfin will silently fall back to CPU
      transcoding. Check the hostpci mapping in Proxmox and that i915 loaded.
    success_msg: iGPU render node present.